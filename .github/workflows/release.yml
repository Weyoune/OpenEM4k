# A tag v* builds the programs for Windows, Linux and macOS (universal: Apple Silicon and Intel) and attaches them
# as ZIP files to the GitHub release of that tag.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: build/Release/em4k_match.exe
          - os: ubuntu-latest
            name: linux-x64
            binary: build/em4k_match
          - os: macos-latest
            name: macos-universal
            binary: build/em4k_match
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: SDL2 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev
      - name: Configure
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then extra=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0); fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: |
          dir="OpenEM4k-$TAG-${{ matrix.name }}"
          mkdir "$dir"
          cp "${{ matrix.binary }}" LIESMICH.txt "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$dir.zip" "$dir" > /dev/null; else zip -r -q "$dir.zip" "$dir"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then lipo -info "$dir/em4k_match"; fi
      - name: Attach to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "OpenEM4k $TAG" --notes-file RELEASE_NOTES.md || true
          gh release upload "$TAG" "OpenEM4k-$TAG-${{ matrix.name }}.zip" --clobber
